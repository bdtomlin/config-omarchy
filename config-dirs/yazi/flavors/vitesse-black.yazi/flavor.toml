sep_right = { open = "", close = "" }
perm_type = { fg = "#4d9375" }
perm_read = { fg = "#e6cc77" }
perm_write = { fg = "#cb7676" }
perm_exec = { fg = "#4d9375" }
perm_sep = { fg = "#758575" }
progress_label = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#4d9375", bg = "#050505" }
progress_error = { fg = "#000000", bg = "#cb7676" }

[pick]
border = { fg = "#4d9375" }
active = { fg = "#d9739f", bold = true }
inactive = {}

[input]
border = { fg = "#4d9375" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#4d9375" }
active = { fg = "#d9739f", bold = true }
inactive = {}

[tasks]
border = { fg = "#4d9375" }
title = {}
