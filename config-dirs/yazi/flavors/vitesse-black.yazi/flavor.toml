[filetype]
rules = [
	{ mime = "image/*", fg = "#e6cc77" },
	{ mime = "{audio,video}/*", fg = "#d9739f" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#cb7676" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#4d9375" },
	{ url = "*", is = "orphan", fg = "#cb7676" },
	{ url = "*/", fg = "#4d9375" },
	{ url = "*", is = "exec", fg = "#4d9375" },
	{ url = "*", fg = "#dbd7ca" },
]
