[filetype]
rules = [
	{ mime = "image/*", fg = "#d4b56a" },
	{ mime = "{audio,video}/*", fg = "#a88878" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c57a62" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#6f9a62" },
	{ url = "*", is = "orphan", fg = "#c57a62" },
	{ url = "*/", fg = "#c49a52" },
	{ url = "*", is = "exec", fg = "#6f9a62" },
	{ url = "*", fg = "#d6ccb8" },
]
