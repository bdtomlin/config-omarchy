[filetype]
rules = [
	{ mime = "image/*", fg = "#e8bb75" },
	{ mime = "{audio,video}/*", fg = "#c48b7b" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#dc655e" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#cfb28a" },
	{ url = "*", is = "orphan", fg = "#dc655e" },
	{ url = "*/", fg = "#b7aa94" },
	{ url = "*", is = "exec", fg = "#cfb28a" },
	{ url = "*", fg = "#c9c3b8" },
]
