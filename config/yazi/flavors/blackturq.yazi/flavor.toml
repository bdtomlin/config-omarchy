[filetype]
rules = [
	{ mime = "image/*", fg = "#a9d1d7" },
	{ mime = "{audio,video}/*", fg = "#485362" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d35f5f" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#8fecd5" },
	{ url = "*", is = "orphan", fg = "#d35f5f" },
	{ url = "*/", fg = "#adf0e9" },
	{ url = "*", is = "exec", fg = "#8fecd5" },
	{ url = "*", fg = "#c8dcdc" },
]
