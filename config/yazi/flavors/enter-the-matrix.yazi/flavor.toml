[mode]
normal_main = { fg = "#131610", bg = "#7bae4e", bold = true }
normal_alt = { fg = "#7bae4e", bg = "#1b2117" }
select_main = { fg = "#131610", bg = "#4caf7e", bold = true }
select_alt = { fg = "#4caf7e", bg = "#1b2117" }
unset_main = { fg = "#131610", bg = "#a8be5a", bold = true }
