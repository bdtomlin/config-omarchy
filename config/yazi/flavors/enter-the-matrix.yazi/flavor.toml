[filetype]
rules = [
	{ mime = "image/*", fg = "#a8be5a" },
	{ mime = "{audio,video}/*", fg = "#4caf7e" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e5484d" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#7bae4e" },
	{ url = "*", is = "orphan", fg = "#e5484d" },
	{ url = "*/", fg = "#7bae4e" },
	{ url = "*", is = "exec", fg = "#7bae4e" },
	{ url = "*", fg = "#93b298" },
]
