sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#7bae4e" }
perm_read = { fg = "#a8be5a" }
perm_write = { fg = "#e5484d" }
perm_exec = { fg = "#7bae4e" }
perm_sep = { fg = "#33482f" }
progress_label = { fg = "#a8c6ae", bold = true }
progress_normal = { fg = "#7bae4e", bg = "#0b0e09" }
progress_error = { fg = "#131610", bg = "#e5484d" }

[pick]
border = { fg = "#7bae4e" }
active = { fg = "#4caf7e", bold = true }
inactive = {}

[input]
border = { fg = "#7bae4e" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#7bae4e" }
active = { fg = "#4caf7e", bold = true }
inactive = {}

[tasks]
border = { fg = "#7bae4e" }
title = {}
hovered = { fg = "#4caf7e", bold = true }

[which]
mask = { bg = "#0b0e09" }
cand = { fg = "#7cbca0" }
rest = { fg = "#33482f" }
desc = { fg = "#4caf7e" }
separator = " - "
separator_style = { fg = "#33482f" }

[confirm]
border = { fg = "#7bae4e" }
title = { fg = "#7bae4e" }
btn_yes = { fg = "#131610", bg = "#7bae4e", bold = true }
btn_no = { fg = "#131610", bg = "#e5484d", bold = true }

[spot]
border = { fg = "#7bae4e" }
title = { fg = "#7bae4e" }
tbl_col = { fg = "#7cbca0" }
tbl_cell = { fg = "#4caf7e", bg = "#1b2117" }

[notify]
title_info = { fg = "#7bae4e" }
title_warn = { fg = "#a8be5a" }
