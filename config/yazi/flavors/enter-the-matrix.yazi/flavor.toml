find_keyword = { fg = "#a8be5a", bold = true, italic = true, underline = true }
find_position = { fg = "#4caf7e", bg = "reset", bold = true, italic = true }
symlink_target = { fg = "#7cbca0", italic = true }

marker_copied = { fg = "#7bae4e", bg = "#7bae4e" }
marker_cut = { fg = "#e5484d", bg = "#e5484d" }
marker_marked = { fg = "#7bae5a", bg = "#7bae5a" }
marker_selected = { fg = "#a8be5a", bg = "#a8be5a" }

count_copied = { fg = "#131610", bg = "#7bae4e" }
count_cut = { fg = "#131610", bg = "#e5484d" }
count_selected = { fg = "#131610", bg = "#a8be5a" }

border_symbol = "│"
