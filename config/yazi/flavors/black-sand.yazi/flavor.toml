# Black Sand
# Generated by yazi-flavor-from-nvim. Re-running the script replaces this file.

[mgr]
cwd = { fg = "#ced6e0" }

find_keyword = { fg = "#c3b798", bold = true, italic = true, underline = true }
find_position = { fg = "#bc9bbf", bg = "reset", bold = true, italic = true }
symlink_target = { fg = "#8fb5bd", italic = true }

marker_copied = { fg = "#89b39b", bg = "#89b39b" }
marker_cut = { fg = "#bd8489", bg = "#bd8489" }
marker_marked = { fg = "#c19f8b", bg = "#c19f8b" }
marker_selected = { fg = "#c3b798", bg = "#c3b798" }

count_copied = { fg = "#14181e", bg = "#89b39b" }
count_cut = { fg = "#14181e", bg = "#bd8489" }
count_selected = { fg = "#14181e", bg = "#c3b798" }

border_symbol = "│"
border_style = { fg = "#525d6a" }

[tabs]
active = { fg = "#14181e", bg = "#ced6e0", bold = true }
inactive = { fg = "#ced6e0", bg = "#1c2026" }

[mode]
normal_main = { fg = "#14181e", bg = "#ced6e0", bold = true }
normal_alt = { fg = "#ced6e0", bg = "#1c2026" }
select_main = { fg = "#14181e", bg = "#bc9bbf", bold = true }
select_alt = { fg = "#bc9bbf", bg = "#1c2026" }
unset_main = { fg = "#14181e", bg = "#c3b798", bold = true }
unset_alt = { fg = "#c3b798", bg = "#1c2026" }

[indicator]
parent = { fg = "#ced6e0", bg = "#1c2026", reversed = false }
current = { fg = "#14181e", bg = "#ced6e0", reversed = false }
preview = { fg = "#14181e", bg = "#ced6e0", reversed = false }
padding = { open = " ", close = "" }

[status]
overall = { fg = "#ced6e0", bg = "#1c2026" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#ced6e0" }
perm_read = { fg = "#c3b798" }
perm_write = { fg = "#bd8489" }
perm_exec = { fg = "#89b39b" }
perm_sep = { fg = "#525d6a" }
progress_label = { fg = "#e9eef5", bold = true }
progress_normal = { fg = "#89b39b", bg = "#080b10" }
progress_error = { fg = "#14181e", bg = "#bd8489" }

[pick]
border = { fg = "#ced6e0" }
active = { fg = "#bc9bbf", bold = true }
inactive = {}

[input]
border = { fg = "#ced6e0" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#ced6e0" }
active = { fg = "#bc9bbf", bold = true }
inactive = {}

[tasks]
border = { fg = "#ced6e0" }
title = {}
hovered = { fg = "#bc9bbf", bold = true }

[which]
mask = { bg = "#080b10" }
cand = { fg = "#8fb5bd" }
rest = { fg = "#525d6a" }
desc = { fg = "#bc9bbf" }
separator = " - "
separator_style = { fg = "#525d6a" }

[confirm]
border = { fg = "#ced6e0" }
title = { fg = "#ced6e0" }
btn_yes = { fg = "#14181e", bg = "#89b39b", bold = true }
btn_no = { fg = "#14181e", bg = "#bd8489", bold = true }

[spot]
border = { fg = "#ced6e0" }
title = { fg = "#ced6e0" }
tbl_col = { fg = "#8fb5bd" }
tbl_cell = { fg = "#bc9bbf", bg = "#1c2026" }

[notify]
title_info = { fg = "#89b39b" }
title_warn = { fg = "#c3b798" }
title_error = { fg = "#bd8489" }

[help]
chord = { fg = "#8fb5bd" }
action = { fg = "#bc9bbf" }
hovered = { reversed = true, bold = true }

[filetype]
rules = [
	{ mime = "image/*", fg = "#c3b798" },
	{ mime = "{audio,video}/*", fg = "#bc9bbf" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#bd8489" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#89b39b" },
	{ url = "*", is = "orphan", fg = "#bd8489" },
	{ url = "*/", fg = "#ced6e0" },
	{ url = "*", is = "exec", fg = "#89b39b" },
	{ url = "*", fg = "#ced6e0" },
]
