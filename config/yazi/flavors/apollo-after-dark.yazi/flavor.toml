# Apollo After Dark
# Generated by yazi-flavor-from-nvim. Re-running the script replaces this file.

[mgr]
cwd = { fg = "#e36b2c" }

find_keyword = { fg = "#d5a34a", bold = true, italic = true, underline = true }
find_position = { fg = "#9d7188", bg = "reset", bold = true, italic = true }
symlink_target = { fg = "#62a29e", italic = true }

marker_copied = { fg = "#8c9b67", bg = "#8c9b67" }
marker_cut = { fg = "#c95d4f", bg = "#c95d4f" }
marker_marked = { fg = "#e36b2c", bg = "#e36b2c" }
marker_selected = { fg = "#d5a34a", bg = "#d5a34a" }

count_copied = { fg = "#151718", bg = "#8c9b67" }
count_cut = { fg = "#151718", bg = "#c95d4f" }
count_selected = { fg = "#151718", bg = "#d5a34a" }

border_symbol = "│"
border_style = { fg = "#5d5d54" }

[tabs]
active = { fg = "#151718", bg = "#e36b2c", bold = true }
inactive = { fg = "#e36b2c", bg = "#252827" }

[mode]
normal_main = { fg = "#151718", bg = "#e36b2c", bold = true }
normal_alt = { fg = "#e36b2c", bg = "#252827" }
select_main = { fg = "#151718", bg = "#9d7188", bold = true }
select_alt = { fg = "#9d7188", bg = "#252827" }
unset_main = { fg = "#151718", bg = "#d5a34a", bold = true }
unset_alt = { fg = "#d5a34a", bg = "#252827" }

[indicator]
parent = { fg = "#d8d0b8", bg = "#252827", reversed = false }
current = { fg = "#151718", bg = "#e36b2c", reversed = false }
preview = { fg = "#151718", bg = "#e36b2c", reversed = false }
padding = { open = " ", close = "" }

[status]
overall = { fg = "#d8d0b8", bg = "#252827" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#e36b2c" }
perm_read = { fg = "#d5a34a" }
perm_write = { fg = "#c95d4f" }
perm_exec = { fg = "#8c9b67" }
perm_sep = { fg = "#5d5d54" }
progress_label = { fg = "#f1e8ce", bold = true }
progress_normal = { fg = "#8c9b67", bg = "#090a0b" }
progress_error = { fg = "#151718", bg = "#c95d4f" }

[pick]
border = { fg = "#e36b2c" }
active = { fg = "#9d7188", bold = true }
inactive = {}

[input]
border = { fg = "#e36b2c" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#e36b2c" }
active = { fg = "#9d7188", bold = true }
inactive = {}

[tasks]
border = { fg = "#e36b2c" }
title = {}
hovered = { fg = "#9d7188", bold = true }

[which]
mask = { bg = "#090a0b" }
cand = { fg = "#62a29e" }
rest = { fg = "#5d5d54" }
desc = { fg = "#9d7188" }
separator = " - "
separator_style = { fg = "#5d5d54" }

[confirm]
border = { fg = "#e36b2c" }
title = { fg = "#e36b2c" }
btn_yes = { fg = "#151718", bg = "#8c9b67", bold = true }
btn_no = { fg = "#151718", bg = "#c95d4f", bold = true }

[spot]
border = { fg = "#e36b2c" }
title = { fg = "#e36b2c" }
tbl_col = { fg = "#62a29e" }
tbl_cell = { fg = "#9d7188", bg = "#252827" }

[notify]
title_info = { fg = "#8c9b67" }
title_warn = { fg = "#d5a34a" }
title_error = { fg = "#c95d4f" }

[help]
chord = { fg = "#62a29e" }
action = { fg = "#9d7188" }
hovered = { reversed = true, bold = true }

[filetype]
rules = [
	{ mime = "image/*", fg = "#d5a34a" },
	{ mime = "{audio,video}/*", fg = "#9d7188" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c95d4f" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#8c9b67" },
	{ url = "*", is = "orphan", fg = "#c95d4f" },
	{ url = "*/", fg = "#e36b2c" },
	{ url = "*", is = "exec", fg = "#8c9b67" },
	{ url = "*", fg = "#d8d0b8" },
]
