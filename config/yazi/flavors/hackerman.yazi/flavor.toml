	{ mime = "image/*", fg = "#50f7d4" },
	{ mime = "{audio,video}/*", fg = "#86a7df" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#50f872" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#4fe88f" },
	{ url = "*", is = "orphan", fg = "#50f872" },
	{ url = "*/", fg = "#82fb9c" },
	{ url = "*", is = "exec", fg = "#4fe88f" },
	{ url = "*", fg = "#ddf7ff" },
]
