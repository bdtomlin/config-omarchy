active = { fg = "#de9568", bold = true }
inactive = {}

[input]
border = { fg = "#ab6a57" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#ab6a57" }
active = { fg = "#de9568", bold = true }
inactive = {}

[tasks]
border = { fg = "#ab6a57" }
title = {}
