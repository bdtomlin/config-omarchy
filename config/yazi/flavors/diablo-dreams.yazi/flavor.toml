[filetype]
rules = [
	{ mime = "image/*", fg = "#ffeb91" },
	{ mime = "{audio,video}/*", fg = "#de9568" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#b48a5c" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#d2c074" },
	{ url = "*", is = "orphan", fg = "#b48a5c" },
	{ url = "*/", fg = "#ab6a57" },
	{ url = "*", is = "exec", fg = "#d2c074" },
	{ url = "*", fg = "#fef2c9" },
]
