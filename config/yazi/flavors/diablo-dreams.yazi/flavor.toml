btn_yes = { fg = "#100e0a", bg = "#d2c074", bold = true }
btn_no = { fg = "#100e0a", bg = "#b48a5c", bold = true }

[spot]
border = { fg = "#ab6a57" }
title = { fg = "#ab6a57" }
