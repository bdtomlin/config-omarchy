perm_type = { fg = "#ab6a57" }
perm_read = { fg = "#ffeb91" }
perm_write = { fg = "#b48a5c" }
perm_exec = { fg = "#d2c074" }
perm_sep = { fg = "#817a6b" }
progress_label = { fg = "#fef5d7", bold = true }
progress_normal = { fg = "#d2c074", bg = "#080705" }
progress_error = { fg = "#100e0a", bg = "#b48a5c" }

[pick]
