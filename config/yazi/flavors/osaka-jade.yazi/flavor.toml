# Osaka Jade
# Generated by yazi-flavor-from-nvim. Re-running the script replaces this file.

[mgr]
cwd = { fg = "#509475" }

find_keyword = { fg = "#459451", bold = true, italic = true, underline = true }
find_position = { fg = "#d2689c", bg = "reset", bold = true, italic = true }
symlink_target = { fg = "#2dd5b7", italic = true }

marker_copied = { fg = "#549e6a", bg = "#549e6a" }
marker_cut = { fg = "#ff5345", bg = "#ff5345" }
marker_marked = { fg = "#a2734b", bg = "#a2734b" }
marker_selected = { fg = "#459451", bg = "#459451" }

count_copied = { fg = "#111c18", bg = "#549e6a" }
count_cut = { fg = "#111c18", bg = "#ff5345" }
count_selected = { fg = "#111c18", bg = "#459451" }

border_symbol = "│"
border_style = { fg = "#53685b" }

[tabs]
active = { fg = "#111c18", bg = "#509475", bold = true }
inactive = { fg = "#509475", bg = "#23372b" }

[mode]
normal_main = { fg = "#111c18", bg = "#509475", bold = true }
normal_alt = { fg = "#509475", bg = "#23372b" }
select_main = { fg = "#111c18", bg = "#d2689c", bold = true }
select_alt = { fg = "#d2689c", bg = "#23372b" }
unset_main = { fg = "#111c18", bg = "#459451", bold = true }
unset_alt = { fg = "#459451", bg = "#23372b" }

[indicator]
parent = { fg = "#c1c497", bg = "#23372b", reversed = false }
current = { fg = "#111c18", bg = "#509475", reversed = false }
preview = { fg = "#111c18", bg = "#509475", reversed = false }
padding = { open = " ", close = "" }

[status]
overall = { fg = "#c1c497", bg = "#23372b" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#509475" }
perm_read = { fg = "#459451" }
perm_write = { fg = "#ff5345" }
perm_exec = { fg = "#549e6a" }
perm_sep = { fg = "#53685b" }
progress_label = { fg = "#f7e8b2", bold = true }
progress_normal = { fg = "#549e6a", bg = "#090f0d" }
progress_error = { fg = "#111c18", bg = "#ff5345" }

[pick]
border = { fg = "#509475" }
active = { fg = "#d2689c", bold = true }
inactive = {}

[input]
border = { fg = "#509475" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#509475" }
active = { fg = "#d2689c", bold = true }
inactive = {}

[tasks]
border = { fg = "#509475" }
title = {}
hovered = { fg = "#d2689c", bold = true }

[which]
mask = { bg = "#090f0d" }
cand = { fg = "#2dd5b7" }
rest = { fg = "#53685b" }
desc = { fg = "#d2689c" }
separator = " - "
separator_style = { fg = "#53685b" }

[confirm]
border = { fg = "#509475" }
title = { fg = "#509475" }
btn_yes = { fg = "#111c18", bg = "#549e6a", bold = true }
btn_no = { fg = "#111c18", bg = "#ff5345", bold = true }

[spot]
border = { fg = "#509475" }
title = { fg = "#509475" }
tbl_col = { fg = "#2dd5b7" }
tbl_cell = { fg = "#d2689c", bg = "#23372b" }

[notify]
title_info = { fg = "#549e6a" }
title_warn = { fg = "#459451" }
title_error = { fg = "#ff5345" }

[help]
chord = { fg = "#2dd5b7" }
action = { fg = "#d2689c" }
hovered = { reversed = true, bold = true }

[filetype]
rules = [
	{ mime = "image/*", fg = "#459451" },
	{ mime = "{audio,video}/*", fg = "#d2689c" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff5345" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#549e6a" },
	{ url = "*", is = "orphan", fg = "#ff5345" },
	{ url = "*/", fg = "#509475" },
	{ url = "*", is = "exec", fg = "#549e6a" },
	{ url = "*", fg = "#c1c497" },
]
