# Hacker Keycode
# Generated by yazi-flavor-from-nvim. Re-running the script replaces this file.

[mgr]
cwd = { fg = "#31f7a5" }

find_keyword = { fg = "#e9d66b", bold = true, italic = true, underline = true }
find_position = { fg = "#c678dd", bg = "reset", bold = true, italic = true }
symlink_target = { fg = "#41e9e1", italic = true }

marker_copied = { fg = "#31f7a5", bg = "#31f7a5" }
marker_cut = { fg = "#ff5f69", bg = "#ff5f69" }
marker_marked = { fg = "#ff9b50", bg = "#ff9b50" }
marker_selected = { fg = "#e9d66b", bg = "#e9d66b" }

count_copied = { fg = "#07110f", bg = "#31f7a5" }
count_cut = { fg = "#07110f", bg = "#ff5f69" }
count_selected = { fg = "#07110f", bg = "#e9d66b" }

border_symbol = "│"
border_style = { fg = "#46685d" }

[tabs]
active = { fg = "#07110f", bg = "#31f7a5", bold = true }
inactive = { fg = "#31f7a5", bg = "#10231d" }

[mode]
normal_main = { fg = "#07110f", bg = "#31f7a5", bold = true }
normal_alt = { fg = "#31f7a5", bg = "#10231d" }
select_main = { fg = "#07110f", bg = "#c678dd", bold = true }
select_alt = { fg = "#c678dd", bg = "#10231d" }
unset_main = { fg = "#07110f", bg = "#e9d66b", bold = true }
unset_alt = { fg = "#e9d66b", bg = "#10231d" }

[indicator]
parent = { fg = "#dfffee", bg = "#10231d", reversed = false }
current = { fg = "#07110f", bg = "#31f7a5", reversed = false }
preview = { fg = "#07110f", bg = "#31f7a5", reversed = false }
padding = { open = " ", close = "" }

[status]
overall = { fg = "#dfffee", bg = "#10231d" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#31f7a5" }
perm_read = { fg = "#e9d66b" }
perm_write = { fg = "#ff5f69" }
perm_exec = { fg = "#31f7a5" }
perm_sep = { fg = "#46685d" }
progress_label = { fg = "#f2fff9", bold = true }
progress_normal = { fg = "#31f7a5", bg = "#020605" }
progress_error = { fg = "#07110f", bg = "#ff5f69" }

[pick]
border = { fg = "#31f7a5" }
active = { fg = "#c678dd", bold = true }
inactive = {}

[input]
border = { fg = "#31f7a5" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#31f7a5" }
active = { fg = "#c678dd", bold = true }
inactive = {}

[tasks]
border = { fg = "#31f7a5" }
title = {}
hovered = { fg = "#c678dd", bold = true }

[which]
mask = { bg = "#020605" }
cand = { fg = "#41e9e1" }
rest = { fg = "#46685d" }
desc = { fg = "#c678dd" }
separator = " - "
separator_style = { fg = "#46685d" }

[confirm]
border = { fg = "#31f7a5" }
title = { fg = "#31f7a5" }
btn_yes = { fg = "#07110f", bg = "#31f7a5", bold = true }
btn_no = { fg = "#07110f", bg = "#ff5f69", bold = true }

[spot]
border = { fg = "#31f7a5" }
title = { fg = "#31f7a5" }
tbl_col = { fg = "#41e9e1" }
tbl_cell = { fg = "#c678dd", bg = "#10231d" }

[notify]
title_info = { fg = "#31f7a5" }
title_warn = { fg = "#e9d66b" }
title_error = { fg = "#ff5f69" }

[help]
chord = { fg = "#41e9e1" }
action = { fg = "#c678dd" }
hovered = { reversed = true, bold = true }

[filetype]
rules = [
	{ mime = "image/*", fg = "#e9d66b" },
	{ mime = "{audio,video}/*", fg = "#c678dd" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff5f69" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#31f7a5" },
	{ url = "*", is = "orphan", fg = "#ff5f69" },
	{ url = "*/", fg = "#31f7a5" },
	{ url = "*", is = "exec", fg = "#31f7a5" },
	{ url = "*", fg = "#dfffee" },
]
